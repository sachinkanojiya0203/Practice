<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
    <title>Build A calculator</title>
</head>

<body>  
    <h1>calculator</h1>

    <div class="calculator-container">
        <div class="calculator">
            <input type="text" disabled  id="number-input">
            <input type="text" placeholder="ANS" disabled id="input-result">
            <div class="buttons">
                <div class="row">
                    <div onclick="handleClickButton(this)" class="col col-3 oprator cal-buttons"><span class="btn-sp">+</span></div>
                    <div onclick="handleClickButton(this)" class="col col-3 oprator cal-buttons"><span class="btn-sp">-</span></div>
                    <div onclick="handleClickButton(this)" class="col col-3 oprator cal-buttons"><span class="btn-sp">*</span></div>
                    <div onclick="handleClickButton(this)" class="col col-3 oprator cal-buttons"><span class="btn-sp">/</span></div>
                </div>
                <div class="row">
                    <div onclick="handleClickButton(this)" class="col col-3 cal-buttons"><span class="btn-sp">7</span></div>
                    <div onclick="handleClickButton(this)" class="col col-3 cal-buttons"><span class="btn-sp">8</span></div>
                    <div onclick="handleClickButton(this)" class="col col-3 cal-buttons"><span class="btn-sp">9</span></div>
                </div>
                <div class="row">
                    <div onclick="handleClickButton(this)" class="col col-3 cal-buttons"><span class="btn-sp">4</span></div>
                    <div onclick="handleClickButton(this)" class="col col-3 cal-buttons"><span class="btn-sp">5</span></div>
                    <div onclick="handleClickButton(this)" class="col col-3 cal-buttons"><span class="btn-sp">6</span></div>
                </div>
                <div class="row">
                    <div onclick="handleClickButton(this)" class="col col-3 cal-buttons"><span class="btn-sp">1</span></div>
                    <div onclick="handleClickButton(this)" class="col col-3 cal-buttons"><span class="btn-sp">2</span></div>
                    <div onclick="handleClickButton(this)" class="col col-3 cal-buttons"><span class="btn-sp">4</span></div>
                </div>
                <div class="row">
                    <div onclick="handleClickButton(this)" class="col col-4 cal-buttons"><span class="btn-sp">0</span></div>
                    <div onclick=" reset();" class="col col-3 cal-buttons"><span class="btn-sp">c</span>lear</div> 
                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>

</html>
